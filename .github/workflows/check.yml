name: Convoy engine
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-cmake --parallel 2 && ctest --test-dir build-cmake --output-on-failure
      - run: cmake -S . -B build-cmake-sse -DCMAKE_BUILD_TYPE=Release -DCONVOY_DISABLE_AVX=ON
      - run: cmake --build build-cmake-sse --parallel 2 && ctest --test-dir build-cmake-sse --output-on-failure
      - run: cmake -S . -B build-cmake-uniform -DCMAKE_BUILD_TYPE=Release -DCONVOY_UNIFORM_PARTITIONS=ON
      - run: cmake --build build-cmake-uniform --parallel 2 && ctest --test-dir build-cmake-uniform --output-on-failure
